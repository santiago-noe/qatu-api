services:
  db:
    # Postgres 18 con PostGIS (mapa y distancias, docs/04)
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: qatu
      POSTGRES_PASSWORD: qatu
      POSTGRES_DB: qatu
    # 5433 en el equipo: el 5432 suele estar ocupado por un PostgreSQL local.
    ports: ["5433:5432"]
    volumes: [qatu_pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatu -d qatu"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [svc]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: [qatu_redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [svc]
  # Correo de desarrollo: recibe todo lo que envía la API. Bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [svc]
volumes:
  qatu_pgdata:
  qatu_redisdata:
networks:
  svc:
    external: true
