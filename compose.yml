services:
  db:
    # Postgres 18 con PostGIS (mapa y distancias, docs/04)
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: qatu
      POSTGRES_PASSWORD: qatu
      POSTGRES_DB: qatu
    # 5433 en el equipo: el 5432 suele estar ocupado por un PostgreSQL local.
    ports: ["5433:5432"]
    volumes: [qatu_pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatu -d qatu"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [svc]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: [qatu_redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [svc]
  # Correo de desarrollo: recibe todo lo que envía la API. Bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [svc]
  # Almacenamiento S3 de desarrollo (fotos de publicaciones, feature 003). En producción es
  # Cloudflare R2. MinIO ya no publica imágenes: SeaweedFS da la misma API S3.
  # Solo el bucket qatu-public se lee sin credenciales (dev/seaweedfs-s3.json). CORS: la app en
  # desarrollo (3000) y la de las pruebas e2e (3200) suben fotos directo desde el navegador.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=http://localhost:3000,http://localhost:3200
    ports: ["8333:8333"]
    volumes:
      - qatu_storage:/data
      - ./dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [svc]
volumes:
  qatu_pgdata:
  qatu_redisdata:
  qatu_storage:
networks:
  svc:
    external: true
