openapi: 3.1.0
info:
  title: Qatu API
  version: 0.3.0
  summary: Marketplace de alquiler de herramientas y servicios en Ayacucho.
  description: |
    API REST de qatu-api (Go, Fiber). Cubre las features 001 (cuentas e identidad),
    002 (catálogo y ubicación) y 003 (publicaciones de herramientas). qatu-app la usa siempre a través de su BFF; el navegador
    nunca la llama directo.

    **Sesión.** El login devuelve un token opaco. qatu-app lo guarda en una cookie httpOnly;
    herramientas como Bruno lo envían en `Authorization: Bearer <token>`.

    **Rutas internas** (`/admin/*`): sesión, rol `admin` y el segundo paso confirmado
    (`POST /auth/two-factor/verify`). Sin el segundo paso responden 403 `dos_pasos_requerido`.

    **Errores.** Siempre `{"error": "codigo", "message": "texto"}`: el código es estable
    para la app y el mensaje, legible en español. Un 429 trae `Retry-After`.

    **Dinero** en céntimos enteros (PEN); **porcentajes** en puntos básicos (1000 = 10 %).
    **Coordenadas** en WGS 84; en GeoJSON el orden es longitud, latitud.
servers:
  - url: http://localhost:8080/api/v1
    description: Local (compose)
tags:
  - name: Salud
    description: Estado de Postgres y Redis (para el orquestador).
  - name: Autenticación
    description: Feature 001. Registro, sesión, correo, contraseña, Google y segundo paso.
  - name: Mi cuenta
    description: Feature 001. Perfil, contraseña, sesiones y ubicación de la persona.
  - name: Arrendador
    description: Feature 003. Perfil de arrendador, publicaciones propias y su calendario.
  - name: Catálogo público
    description: Feature 002. Sin sesión y con caché (se invalida al editar desde el admin).
  - name: Moderación
    description: Feature 003. Roles moderator y admin, con segundo paso.
  - name: Admin · Usuarios
    description: Buscar cuentas, roles internos y suspensiones (feature 001).
  - name: Admin · Catálogo
    description: Categorías y oficios, con su alcance por ciudad.
  - name: Admin · Ciudades
    description: Ciudades y distritos con su límite oficial.
  - name: Admin · Ajustes
    description: platform_settings (comisiones y reglas) con historial.

security:
  - session: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Salud]
      summary: Estado de la API y sus dependencias
      security: []
      responses:
        "200":
          description: Todo arriba.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Alguna dependencia falla.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/register:
    post:
      operationId: register
      tags: [Autenticación]
      summary: Crear una cuenta
      description: Envía el código de verificación al correo. Limitado por IP y con captcha.
      security: []
      parameters:
        - $ref: "#/components/parameters/Turnstile"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, adult_declared, accept_legal]
              properties:
                email: { type: string, format: email }
                name: { type: string, maxLength: 120 }
                password: { type: string, minLength: 10, maxLength: 128, description: "Frase; se revisa contra filtraciones conocidas." }
                adult_declared: { type: boolean, description: Declara ser mayor de 18 años. }
                accept_legal: { type: boolean, description: Acepta términos y política de privacidad (versionados). }
      responses:
        "201":
          description: Cuenta creada y sesión abierta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      operationId: login
      tags: [Autenticación]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Sesión abierta. Con `two_factor_required` la app pide el código antes del panel interno.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      operationId: logout
      tags: [Autenticación]
      summary: Cerrar esta sesión
      responses:
        "204": { description: Cerrada. }
        "401": { $ref: "#/components/responses/Error" }

  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [Autenticación]
      summary: Cerrar todas las sesiones de la cuenta
      responses:
        "204": { description: Cerradas. }
        "401": { $ref: "#/components/responses/Error" }

  /auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [Autenticación]
      summary: Confirmar el correo con el código de 6 dígitos
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Correo confirmado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /auth/email/resend:
    post:
      operationId: resendEmailCode
      tags: [Autenticación]
      summary: Reenviar el código de verificación
      responses:
        "202": { description: El correo se envía (no se confirma la entrega). }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Autenticación]
      summary: Pedir un código para recuperar la contraseña
      description: Siempre 202, exista o no la cuenta (no revela qué correos existen).
      security: []
      parameters:
        - $ref: "#/components/parameters/Turnstile"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: "Si la cuenta existe, se envía el código." }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Autenticación]
      summary: Cambiar la contraseña con el código del correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Contraseña cambiada; se cerraron todas las sesiones. }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/google/start:
    post:
      operationId: startGoogle
      tags: [Autenticación]
      summary: Empezar el acceso con Google
      description: El BFF guarda `state` en una cookie propia y lo compara en el callback.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adult_declared: { type: boolean, description: Solo para crear una cuenta nueva. }
                accept_legal: { type: boolean, description: Solo para crear una cuenta nueva. }
      responses:
        "200":
          description: Dirección de Google a la que ir.
          content:
            application/json:
              schema:
                type: object
                required: [url, state]
                properties:
                  url: { type: string, format: uri }
                  state: { type: string }
        "503": { $ref: "#/components/responses/Error" }

  /auth/google/callback:
    post:
      operationId: finishGoogle
      tags: [Autenticación]
      summary: Terminar el acceso con Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "200":
          description: Sesión abierta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /auth/two-factor/send:
    post:
      operationId: sendTwoFactorCode
      tags: [Autenticación]
      summary: Enviar el código del segundo paso (roles internos)
      responses:
        "202": { description: El correo se envía. }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/two-factor/verify:
    post:
      operationId: verifyTwoFactor
      tags: [Autenticación]
      summary: Confirmar el segundo paso
      description: Desde aquí la sesión entra a las rutas internas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "204": { description: Confirmado. }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [Mi cuenta]
      summary: La cuenta de la sesión
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [Mi cuenta]
      summary: Cambiar el nombre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [Mi cuenta]
      summary: Cambiar o crear la contraseña
      description: Cierra las demás sesiones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string, description: Vacío si la cuenta aún no tiene contraseña (entró con Google). }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Cambiada. }
        "422": { $ref: "#/components/responses/Error" }

  /me/sessions:
    get:
      operationId: listSessions
      tags: [Mi cuenta]
      summary: Sesiones abiertas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }

  /me/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [Mi cuenta]
      summary: Cerrar una sesión
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cerrada. }
        "404": { $ref: "#/components/responses/Error" }

  /me/location:
    get:
      operationId: getMyLocation
      tags: [Mi cuenta]
      summary: Mi ciudad y distrito
      responses:
        "200":
          description: "`location` es null si aún no eligió."
          content:
            application/json:
              schema:
                type: object
                required: [location]
                properties:
                  location:
                    oneOf:
                      - $ref: "#/components/schemas/Location"
                      - type: "null"
    put:
      operationId: setMyLocation
      tags: [Mi cuenta]
      summary: Elegir mi ciudad y distrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city, zone]
              properties:
                city: { type: string, examples: [ayacucho] }
                zone: { type: string, examples: [carmen-alto] }
      responses:
        "200":
          description: Guardada.
          content:
            application/json:
              schema:
                type: object
                required: [location]
                properties:
                  location: { $ref: "#/components/schemas/Location" }
        "404": { $ref: "#/components/responses/Error" }

  /me/lender:
    get:
      operationId: getLender
      tags: [Arrendador]
      summary: Mi perfil de arrendador
      responses:
        "200":
          description: "`lender` es null si aún no lo activó."
          content:
            application/json:
              schema:
                type: object
                required: [lender]
                properties:
                  lender:
                    oneOf:
                      - $ref: "#/components/schemas/Lender"
                      - type: "null"
    put:
      operationId: saveLender
      tags: [Arrendador]
      summary: Activar o editar mi perfil de arrendador
      description: |
        Exige el correo verificado. La primera vez pide `accept_terms` (queda el consentimiento
        versionado) y da el rol `lender`. El celular es privado: solo se revela a la otra parte
        tras confirmar una reserva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, phone, city, zone]
              properties:
                kind: { type: string, enum: [person, business] }
                business_name: { type: string, minLength: 2, maxLength: 80, description: Obligatorio para negocios. }
                phone: { type: string, examples: ["987 654 321"], description: "Celular peruano; se guarda como +519XXXXXXXX." }
                city: { type: string, examples: [ayacucho] }
                zone: { type: string, examples: [carmen-alto] }
                accept_terms: { type: boolean }
      responses:
        "200":
          description: Guardado.
          content:
            application/json:
              schema:
                type: object
                required: [lender]
                properties:
                  lender: { $ref: "#/components/schemas/Lender" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/lender/deposit-suggestion:
    get:
      operationId: depositSuggestion
      tags: [Arrendador]
      summary: Garantía sugerida y su rango
      description: "Porcentaje del valor de reposición según el riesgo de la categoría, redondeado a S/ 10; se puede ajustar entre el mínimo y el máximo."
      parameters:
        - { name: category, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: value, in: query, required: true, description: Valor de reposición en céntimos., schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK (céntimos).
          content:
            application/json:
              schema:
                type: object
                required: [suggested, min, max]
                properties:
                  suggested: { type: integer }
                  min: { type: integer }
                  max: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings:
    get:
      operationId: listMyListings
      tags: [Arrendador]
      summary: Mis publicaciones
      responses:
        "200":
          description: De la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: object
                required: [listings]
                properties:
                  listings:
                    type: array
                    items: { $ref: "#/components/schemas/Listing" }
    post:
      operationId: createListing
      tags: [Arrendador]
      summary: Crear un borrador
      description: |
        Pide el perfil de arrendador y un tipo de herramienta publicable en su ciudad. Lo que falte
        de las reglas (modo de reserva, cancelación, verificación, duraciones) toma valores por defecto.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingFields" }
      responses:
        "201":
          description: Borrador creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings/{id}:
    get:
      operationId: getMyListing
      tags: [Arrendador]
      summary: Una de mis publicaciones (con el punto exacto)
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateListing
      tags: [Arrendador]
      summary: Guardar el formulario completo
      description: |
        Con la `version` leída (bloqueo optimista: 409 `version_desactualizada` si cambió). En
        revisión o archivada no se edita. Publicada o pausada debe seguir completa y no cambia de
        categoría. Editar precios no afecta reservas ya hechas.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ListingFields"
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/submit:
    post:
      operationId: submitListing
      tags: [Arrendador]
      summary: Enviar a publicar
      description: |
        Revisa atributos (JSON Schema de la categoría), garantía en rango, al menos 3 fotos listas y
        una forma de entrega. Va a revisión si es la primera del arrendador, si la categoría es de
        riesgo alto o si la habían rechazado; si no, se publica.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody: { $ref: "#/components/requestBodies/Version" }
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/pause:
    post:
      operationId: pauseListing
      tags: [Arrendador]
      summary: Pausar una publicada
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody: { $ref: "#/components/requestBodies/Version" }
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/resume:
    post:
      operationId: resumeListing
      tags: [Arrendador]
      summary: Reanudar una pausada
      description: Solo si su categoría sigue permitida en la ciudad.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody: { $ref: "#/components/requestBodies/Version" }
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/archive:
    post:
      operationId: archiveListing
      tags: [Arrendador]
      summary: Archivar (sale del catálogo para siempre)
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody: { $ref: "#/components/requestBodies/Version" }
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/duplicate:
    post:
      operationId: duplicateListing
      tags: [Arrendador]
      summary: Duplicar como borrador (otra unidad del mismo modelo)
      description: No copia fotos, calendario ni estado; el punto público sale del ID nuevo.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "201":
          description: Borrador nuevo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/availability:
    get:
      operationId: listingCalendar
      tags: [Arrendador]
      summary: Bloqueos del calendario en una ventana (hasta 13 meses)
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [blocks]
                properties:
                  blocks:
                    type: array
                    items: { $ref: "#/components/schemas/AvailabilityBlock" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: blockDates
      tags: [Arrendador]
      summary: Bloquear fechas
      description: "El fin no se incluye. 409 `fechas_ocupadas` si se cruza con otro bloqueo o una reserva."
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              properties:
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
                note: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Bloqueado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityBlock" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/availability/{block}:
    delete:
      operationId: unblockDates
      tags: [Arrendador]
      summary: Quitar un bloqueo manual
      description: Las reservas no se quitan desde el calendario.
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - { name: block, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Quitado. }
        "404": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/photos:
    get:
      operationId: listPhotos
      tags: [Arrendador]
      summary: Fotos de la publicación
      description: Públicas en su orden (la primera es la portada) y luego la de la placa, con URL firmada de 5 minutos.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/Photo" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: requestPhotoUpload
      tags: [Arrendador]
      summary: Pedir la subida de una foto
      description: |
        Registra la foto (pendiente) y devuelve una URL firmada de 15 minutos. El navegador hace el
        `PUT` directo al almacenamiento con esas cabeceras exactas y luego llama a `.../complete`.
        Hasta 12 fotos públicas; una placa nueva reemplaza la anterior.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, content_type, size]
              properties:
                kind: { type: string, enum: [public, serial] }
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 10485760, description: Bytes. }
      responses:
        "201":
          description: Lista para subir.
          content:
            application/json:
              schema:
                type: object
                required: [photo, upload]
                properties:
                  photo: { $ref: "#/components/schemas/Photo" }
                  upload:
                    type: object
                    required: [method, url, headers, expires_at]
                    properties:
                      method: { type: string, enum: [PUT] }
                      url: { type: string, format: uri }
                      headers: { type: object, additionalProperties: { type: string } }
                      expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/photos/order:
    put:
      operationId: reorderPhotos
      tags: [Arrendador]
      summary: Ordenar las fotos públicas
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid }, description: Todas las públicas una vez; la primera es la portada. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/Photo" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/photos/{photo}/complete:
    post:
      operationId: completePhotoUpload
      tags: [Arrendador]
      summary: Confirmar que la foto terminó de subirse
      description: |
        Encola su procesamiento: 3 anchos (320, 800 y 1600 px) en JPEG, enderezada según su EXIF y
        sin metadatos (el original, que puede traer la ubicación GPS, se borra). Repetirlo no la
        procesa dos veces.
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "202":
          description: Se procesa en segundo plano.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /me/listings/{id}/photos/{photo}:
    delete:
      operationId: deletePhoto
      tags: [Arrendador]
      summary: Quitar una foto
      description: Una publicación publicada o pausada no puede quedar con menos de 3 fotos públicas.
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204": { description: Quitada con sus archivos. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /catalog/categories:
    get:
      operationId: listCategories
      tags: [Catálogo público]
      summary: Árbol de categorías u oficios publicables
      description: Sin lo apagado ni lo prohibido. Con `city` aplica lo encendido o apagado en esa ciudad.
      security: []
      parameters:
        - $ref: "#/components/parameters/Vertical"
        - { name: city, in: query, schema: { type: string }, example: ayacucho }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /cities:
    get:
      operationId: listCities
      tags: [Catálogo público]
      summary: Ciudades habilitadas
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [cities]
                properties:
                  cities:
                    type: array
                    items: { $ref: "#/components/schemas/City" }

  /cities/{slug}/zones:
    get:
      operationId: listZones
      tags: [Catálogo público]
      summary: Distritos activos de una ciudad
      security: []
      parameters:
        - $ref: "#/components/parameters/CitySlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/Zone" }
        "404": { $ref: "#/components/responses/Error" }

  /geo/zone:
    get:
      operationId: zoneAt
      tags: [Catálogo público]
      summary: Ciudad y distrito de un punto
      description: El punto no se guarda ni se registra; solo se usa para responder.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, example: -13.1631 }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, example: -74.2236 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/Error" }
        "404":
          description: "`fuera_de_cobertura`: el punto no cae en ningún distrito activo."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /moderation/listings:
    get:
      operationId: moderationQueue
      tags: [Moderación]
      summary: Publicaciones en revisión
      description: |
        La que más espera primero (hasta 100). Con la categoría (riesgo y esquema de atributos), el
        arrendador (nombre y si es su primera publicación) y las fotos públicas. Nunca el punto
        exacto de recojo ni la foto de la placa.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [listings]
                properties:
                  listings:
                    type: array
                    items: { $ref: "#/components/schemas/ReviewItem" }
        "403": { $ref: "#/components/responses/Error" }

  /moderation/listings/{id}/approve:
    post:
      operationId: approveListing
      tags: [Moderación]
      summary: Aprobar (se publica)
      description: Nadie modera sus propias publicaciones. Se avisa al arrendador por correo.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody: { $ref: "#/components/requestBodies/Version" }
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /moderation/listings/{id}/reject:
    post:
      operationId: rejectListing
      tags: [Moderación]
      summary: Rechazar con motivo
      description: El arrendador lee el motivo, corrige y vuelve a enviar (vuelve a revisión).
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: { type: integer }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/users:
    get:
      operationId: adminFindUser
      tags: [Admin · Usuarios]
      summary: Buscar una cuenta por correo exacto
      description: No hay listado masivo (datos mínimos, Ley 29733).
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/users/{id}:
    get:
      operationId: adminGetUser
      tags: [Admin · Usuarios]
      summary: Una cuenta
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/users/{id}/roles:
    patch:
      operationId: adminChangeRoles
      tags: [Admin · Usuarios]
      summary: Dar o quitar roles internos
      description: Solo support, moderator y admin; nadie se quita su propio rol admin.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add: { type: array, items: { $ref: "#/components/schemas/Role" } }
                remove: { type: array, items: { $ref: "#/components/schemas/Role" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/users/{id}/status:
    patch:
      operationId: adminChangeStatus
      tags: [Admin · Usuarios]
      summary: Suspender o reactivar una cuenta
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
                reason: { type: string, description: Obligatorio al suspender. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/catalog/categories:
    get:
      operationId: adminListCategories
      tags: [Admin · Catálogo]
      summary: Árbol completo de la vertical (también lo apagado y prohibido)
      parameters:
        - $ref: "#/components/parameters/Vertical"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/AdminCategory" }
    post:
      operationId: adminCreateCategory
      tags: [Admin · Catálogo]
      summary: Crear una categoría, tipo u oficio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/catalog/categories/{id}:
    patch:
      operationId: adminUpdateCategory
      tags: [Admin · Catálogo]
      summary: Editar una categoría
      description: |
        Solo cambian los campos enviados; la vertical no se edita. Al marcarla `prohibited`,
        sus publicaciones activas (y las de sus tipos) salen del catálogo con un motivo y queda
        auditado; nadie puede volver a publicarlas mientras siga prohibida.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/catalog/categories/{id}/cities:
    get:
      operationId: adminCategoryCities
      tags: [Admin · Catálogo]
      summary: Cómo está la categoría en cada ciudad
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Todas las ciudades, también las apagadas.
          content:
            application/json:
              schema:
                type: object
                required: [cities]
                properties:
                  cities:
                    type: array
                    items: { $ref: "#/components/schemas/CategoryCity" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/catalog/categories/{id}/cities/{city}:
    put:
      operationId: adminSetCategoryCity
      tags: [Admin · Catálogo]
      summary: Encender o apagar la categoría solo en una ciudad
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - { name: city, in: path, required: true, schema: { type: string }, example: ayacucho }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: [boolean, "null"]
                  description: null vuelve al valor general de la categoría.
      responses:
        "204": { description: Guardado. }
        "404": { $ref: "#/components/responses/Error" }

  /admin/cities:
    get:
      operationId: adminListCities
      tags: [Admin · Ciudades]
      summary: Todas las ciudades (también las apagadas)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [cities]
                properties:
                  cities:
                    type: array
                    items: { $ref: "#/components/schemas/AdminCity" }
    post:
      operationId: adminCreateCity
      tags: [Admin · Ciudades]
      summary: Dar de alta una ciudad
      description: Nace apagada; se enciende cuando tiene al menos un distrito activo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, region, center]
              properties:
                slug: { $ref: "#/components/schemas/Slug" }
                name: { type: string, maxLength: 80 }
                region: { type: string, maxLength: 80 }
                ubigeo: { type: string, pattern: "^[0-9]{4}$", description: Ubigeo INEI de la provincia (opcional). }
                center: { $ref: "#/components/schemas/GeoPoint" }
      responses:
        "201":
          description: Creada (apagada).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCity" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/cities/{slug}:
    patch:
      operationId: adminUpdateCity
      tags: [Admin · Ciudades]
      summary: Editar una ciudad o encenderla y apagarla
      description: El slug y el ubigeo no cambian. Encenderla sin distritos activos responde 409 `ciudad_sin_distritos`.
      parameters:
        - $ref: "#/components/parameters/CitySlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                region: { type: string, maxLength: 80 }
                center: { $ref: "#/components/schemas/GeoPoint" }
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCity" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/cities/{slug}/zones:
    get:
      operationId: adminListZones
      tags: [Admin · Ciudades]
      summary: La ciudad y todos sus distritos, con el límite simplificado
      parameters:
        - $ref: "#/components/parameters/CitySlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [city, zones]
                properties:
                  city: { $ref: "#/components/schemas/AdminCity" }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/AdminZone" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: adminCreateZone
      tags: [Admin · Ciudades]
      summary: Agregar un distrito
      description: |
        El límite es opcional (sin él, el distrito se elige de la lista pero no se detecta por
        ubicación). Se rechaza si no es un polígono válido (`limite_invalido`), si queda a más de
        60 km del centro de la ciudad (`limite_lejano`, casi siempre latitud y longitud
        invertidas) o si repite más del 1 % del área de otro distrito (`limite_superpuesto`).
      parameters:
        - $ref: "#/components/parameters/CitySlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { $ref: "#/components/schemas/Slug" }
                name: { type: string, maxLength: 80 }
                ubigeo: { type: string, pattern: "^[0-9]{6}$", description: Empieza con el ubigeo de la ciudad. }
                sort_order: { type: integer, minimum: 0, maximum: 32767 }
                enabled: { type: boolean, default: true }
                boundary: { $ref: "#/components/schemas/BoundaryInput" }
      responses:
        "201":
          description: Creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminZone" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/cities/{slug}/zones/{zone}:
    patch:
      operationId: adminUpdateZone
      tags: [Admin · Ciudades]
      summary: Editar un distrito o reemplazar su límite
      description: No se puede apagar el último distrito activo de una ciudad encendida (409 `ciudad_sin_distritos`).
      parameters:
        - $ref: "#/components/parameters/CitySlug"
        - { name: zone, in: path, required: true, schema: { type: string }, example: carmen-alto }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                sort_order: { type: integer, minimum: 0, maximum: 32767 }
                enabled: { type: boolean }
                boundary: { $ref: "#/components/schemas/BoundaryInput" }
      responses:
        "200":
          description: OK (sin el límite en la respuesta).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminZone" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/settings:
    get:
      operationId: adminListSettings
      tags: [Admin · Ajustes]
      summary: Todos los ajustes en todos sus alcances
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: array
                    items: { $ref: "#/components/schemas/Setting" }
    put:
      operationId: adminSetSetting
      tags: [Admin · Ajustes]
      summary: Crear o cambiar un ajuste en su alcance
      description: |
        Gana el alcance más específico: ciudad+categoría > categoría > ciudad+categoría padre >
        categoría padre > ciudad > global. Cada transacción guarda una copia de los valores al
        crearse, así que el cambio solo afecta a las nuevas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { $ref: "#/components/schemas/SettingKey" }
                city: { type: string, description: Slug de la ciudad; vacío = todas. }
                category_id: { type: string, format: uuid, description: Vacío = todas. }
                value: { type: integer }
                description: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setting" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /admin/settings/{key}/history:
    get:
      operationId: adminSettingHistory
      tags: [Admin · Ajustes]
      summary: Historial de cambios de una clave
      parameters:
        - { name: key, in: path, required: true, schema: { $ref: "#/components/schemas/SettingKey" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/SettingChange" }
        "422": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Token de sesión de /auth/login (qatu-app lo envía en una cookie httpOnly).

  parameters:
    Turnstile:
      name: X-Turnstile-Token
      in: header
      description: Token de Cloudflare Turnstile. En desarrollo, sin secreto configurado, no se exige.
      schema: { type: string }
    Vertical:
      name: vertical
      in: query
      required: true
      schema: { type: string, enum: [rental, service] }
    CitySlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      example: ayacucho
    ListingId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photo
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    Version:
      required: true
      description: La versión leída (bloqueo optimista).
      content:
        application/json:
          schema:
            type: object
            required: [version]
            properties:
              version: { type: integer }

  responses:
    Listing:
      description: La publicación con su nuevo estado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Listing" }
    Error:
      description: Error con código estable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Demasiados intentos.
      headers:
        Retry-After:
          description: Segundos a esperar.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, examples: [limite_superpuesto] }
        message: { type: string, examples: [el límite se superpone con otro distrito de la ciudad] }

    Health:
      type: object
      properties:
        status: { type: string, enum: [up, down] }
        components:
          type: object
          additionalProperties: { type: string, enum: [up, down] }

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    Role:
      type: string
      enum: [client, lender, provider, support, moderator, admin]

    User:
      type: object
      required: [id, email_verified, name, roles, status, verification_level, can_transact]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        name: { type: string }
        avatar_url: { type: string, format: uri }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        status: { type: string, enum: [active, suspended, deleted] }
        verification_level: { type: integer, minimum: 0, maximum: 2 }
        can_transact: { type: boolean }

    Lender:
      type: object
      required: [kind, phone, city, zone]
      properties:
        kind: { type: string, enum: [person, business] }
        business_name: { type: string }
        phone: { type: string, examples: ["+51987654321"] }
        city: { $ref: "#/components/schemas/PlaceRef" }
        zone: { $ref: "#/components/schemas/PlaceRef" }

    PlaceRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }

    Prices:
      type: object
      description: "Céntimos; 0 = esa modalidad no se ofrece. El precio por día es obligatorio para publicar."
      properties:
        hour: { type: integer, minimum: 0 }
        day: { type: integer, minimum: 0 }
        weekend: { type: integer, minimum: 0 }
        week: { type: integer, minimum: 0 }
        month: { type: integer, minimum: 0 }

    ListingFields:
      type: object
      required: [category_id, title]
      description: Formulario del asistente. Montos en céntimos (PEN).
      properties:
        category_id: { type: string, format: uuid, description: Un tipo de herramienta (segundo nivel). }
        title: { type: string, minLength: 5, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        attributes: { type: object, description: Según el JSON Schema de la categoría (se valida al enviar). }
        replacement_value: { type: integer, minimum: 0, maximum: 10000000 }
        deposit: { type: integer, minimum: 0, description: Dentro del rango de /me/lender/deposit-suggestion. }
        prices: { $ref: "#/components/schemas/Prices" }
        accessories: { type: array, maxItems: 30, items: { type: string, maxLength: 80 } }
        usage_instructions: { type: string, maxLength: 2000 }
        pickup_enabled: { type: boolean }
        pickup_location:
          description: "Punto exacto, privado. Obligatorio con recojo; debe caer en la ciudad del arrendador."
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        delivery_enabled: { type: boolean }
        delivery_fee: { type: integer, minimum: 0 }
        delivery_zone_ids: { type: array, items: { type: string, format: uuid }, description: "IDs de /cities/{slug}/zones." }
        booking_mode: { type: string, enum: [request, instant] }
        cancel_policy: { type: string, enum: [flexible, moderate, strict] }
        min_verification: { type: integer, minimum: 0, maximum: 2, description: Nunca menor al que pide el riesgo de la categoría. }
        min_notice_hours: { type: integer, minimum: 0, maximum: 168 }
        min_duration_hours: { type: integer, minimum: 1, maximum: 720 }
        max_duration_hours: { type: integer, minimum: 1, maximum: 2160 }

    ListingStatus:
      type: string
      enum: [draft, in_review, published, paused, rejected, archived]

    Listing:
      allOf:
        - $ref: "#/components/schemas/ListingFields"
        - type: object
          required: [id, city_id, status, version, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            city_id: { type: string, format: uuid }
            zone_id: { type: string, format: uuid }
            public_location:
              description: Punto desplazado de forma determinista dentro de public_radius_m; lo que ve el público.
              oneOf:
                - $ref: "#/components/schemas/GeoPoint"
                - type: "null"
            public_radius_m: { type: integer }
            status: { $ref: "#/components/schemas/ListingStatus" }
            rejection_reason: { type: string }
            first_published_at: { type: string, format: date-time }
            version: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    Photo:
      type: object
      required: [id, kind, status, sort_order, urls]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [public, serial] }
        status: { type: string, enum: [pending, ready, failed] }
        width: { type: integer }
        height: { type: integer }
        sort_order: { type: integer }
        urls:
          type: object
          description: Por ancho ("320", "800", "1600"); vacío mientras se procesa.
          additionalProperties: { type: string, format: uri }

    ReviewItem:
      type: object
      required: [listing, owner, category, photos]
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
        owner:
          type: object
          required: [name, first_listing]
          properties:
            name: { type: string }
            first_listing: { type: boolean, description: Aún no tiene ninguna publicación aprobada. }
        category:
          type: object
          required: [id, name, risk_level]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            risk_level: { $ref: "#/components/schemas/RiskLevel" }
            attributes_schema: { type: object }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }

    AvailabilityBlock:
      type: object
      required: [id, start, end, reason]
      properties:
        id: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: No incluido. }
        reason: { type: string, enum: [manual, booking, hold] }
        note: { type: string }

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            suspended_reason: { type: string }

    AuthResponse:
      type: object
      required: [session, user, two_factor_required]
      properties:
        session:
          type: object
          required: [token, expires_at]
          properties:
            token: { type: string }
            expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
        two_factor_required: { type: boolean }
        verification_sent: { type: boolean, description: Solo en el registro. }

    Session:
      type: object
      required: [id, provider, created_at, last_used_at, current]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [password, google, phone_otp] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        ip: { type: string }
        user_agent: { type: string }
        current: { type: boolean }

    Slug:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      examples: [san-juan-bautista]

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    City:
      type: object
      required: [slug, name, region, timezone, center]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        region: { type: string }
        timezone: { type: string, examples: [America/Lima] }
        center: { $ref: "#/components/schemas/GeoPoint" }

    Zone:
      type: object
      required: [id, slug, name, detectable]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        ubigeo: { type: string }
        detectable: { type: boolean, description: Tiene límite y se detecta por la ubicación del navegador. }

    Location:
      type: object
      required: [city, zone]
      properties:
        city: { $ref: "#/components/schemas/City" }
        zone: { $ref: "#/components/schemas/Zone" }

    RiskLevel:
      type: string
      enum: [low, medium, high]
      description: Define la verificación mínima para alquilar (docs/05).

    Category:
      type: object
      required: [id, slug, name, risk_level]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        icon: { type: string, description: Nombre de un ícono de lucide-react. }
        risk_level: { $ref: "#/components/schemas/RiskLevel" }
        attributes_schema: { type: object, description: JSON Schema de los atributos propios. }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    AdminCategory:
      type: object
      required: [id, vertical, slug, name, sort_order, attributes_schema, risk_level, prohibited, enabled]
      properties:
        id: { type: string, format: uuid }
        vertical: { type: string, enum: [rental, service, product, space] }
        parent_id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        sort_order: { type: integer }
        attributes_schema: { type: object }
        risk_level: { $ref: "#/components/schemas/RiskLevel" }
        prohibited: { type: boolean }
        enabled: { type: boolean }
        children:
          type: array
          items: { $ref: "#/components/schemas/AdminCategory" }

    CategoryInput:
      type: object
      required: [vertical, slug, name, risk_level]
      properties:
        vertical: { type: string, enum: [rental, service] }
        parent_id: { type: string, format: uuid, description: Vacío = raíz. El árbol tiene 2 niveles. }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 280 }
        icon: { type: string }
        sort_order: { type: integer, minimum: 0, maximum: 32767 }
        attributes_schema: { type: object }
        risk_level: { $ref: "#/components/schemas/RiskLevel" }
        prohibited: { type: boolean }
        enabled: { type: boolean, default: true }

    CategoryPatch:
      type: object
      properties:
        parent_id: { type: string }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 280 }
        icon: { type: string }
        sort_order: { type: integer, minimum: 0, maximum: 32767 }
        attributes_schema: { type: object }
        risk_level: { $ref: "#/components/schemas/RiskLevel" }
        prohibited: { type: boolean }
        enabled: { type: boolean }

    CategoryCity:
      type: object
      required: [city, name, city_enabled, override, active]
      properties:
        city: { type: string, description: Slug de la ciudad. }
        name: { type: string }
        city_enabled: { type: boolean }
        override:
          type: [boolean, "null"]
          description: null = sigue el valor general de la categoría.
        active: { type: boolean, description: Si se ofrece en la ciudad (una prohibida nunca). }

    AdminCity:
      type: object
      required: [id, slug, name, region, center, enabled]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        region: { type: string }
        ubigeo: { type: string }
        center: { $ref: "#/components/schemas/GeoPoint" }
        enabled: { type: boolean }

    AdminZone:
      type: object
      required: [id, slug, name, sort_order, enabled, has_boundary]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        ubigeo: { type: string }
        sort_order: { type: integer }
        enabled: { type: boolean }
        has_boundary: { type: boolean }
        boundary:
          $ref: "#/components/schemas/MultiPolygon"
          description: Simplificado (~10 m), solo en la lista.

    MultiPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: MultiPolygon }
        coordinates:
          type: array
          description: Polígonos → anillos → posiciones [longitud, latitud].
          items: { type: array, items: { type: array, items: { type: array, items: { type: number } } } }

    BoundaryInput:
      type: object
      description: |
        GeoJSON: una geometría Polygon o MultiPolygon, un Feature con ella o un FeatureCollection
        de un solo Feature (lo que exportan overpass-turbo, geojson.io o el INEI). Hasta 20 000
        vértices; la altura se descarta y la base corrige autointersecciones.
      required: [type]
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon, Feature, FeatureCollection] }

    SettingKey:
      type: string
      enum:
        - rental.owner_commission_bps
        - rental.client_service_fee_bps
        - service.provider_commission_bps
        - service.client_service_fee_bps
        - listings.deposit_low_bps
        - listings.deposit_medium_bps
        - listings.deposit_high_bps
        - listings.deposit_min_factor_bps
        - listings.deposit_max_factor_bps
        - listings.public_radius_m

    Setting:
      type: object
      required: [id, key, value, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        key: { $ref: "#/components/schemas/SettingKey" }
        city_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        value: { type: integer, description: "Puntos básicos, factor en puntos básicos o metros, según la clave." }
        description: { type: string }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    SettingChange:
      type: object
      required: [at, before, after]
      properties:
        at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        ip: { type: string }
        before: { type: [object, "null"], description: null al crearse el alcance. }
        after: { type: object }
